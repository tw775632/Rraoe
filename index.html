<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>chat</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
            }
            #chatPage {
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            #chatArea {
                flex: 1;
                overflow-y: auto;
            }
            #inputArea {
                flex-shrink: 0;
                display: flex;
            }
            #input {
                flex: 1;
            }
            #wordTools {
                flex-shrink: 0;
                display:flex;
                flex-wrap: wrap;
                gap: 10px;
                padding: 10px;
            
            #wordTools textarea {
                flex-basis: 100%;
                min-height:80px;
            }
            #wordTools button ,
            #wordTools input {
                flex: 0 0 auto;
            }
            }
    </style>

<body>
<div id = "chatPage">
    <div id = "chatArea">
        <div id="messages"></div>
    </div>
    <div id = "inputArea">
    <input id="input" type="text" placeholder="talking something"><!--消息显示区-->>
    <button id="send">Send</button><!--输入按钮-->
    <button id="peerSend">peerSend</button><!--peer回复按钮-->
</div>
<div id = "wordTools">
    <textarea id="wordsInput"></textarea><!--字卡库框-->
    <button id="saveWords"> 保存字卡</button><!--保存字卡按钮-->
    <button id="exportBtn"> 导出文件</button>  <!--导出文件按钮-->
    <button id="exportWordsBtn"> 导出字卡</button><!--导出字卡按钮-->
    <input type="file" id="importFile" accept=".json"><!--导入文件输入框-->
    <button id="importBtn"> 导入文件</button><!--导入文件按钮-->
    </div>
</div>


    <script>
    //词库
        let wordGroups = {
            "问候":["你好","晚上好"],
            "回应":["我在","是我"]
        };
    //塔罗牌库
    const tarotNames = [
//major Arcana
    "愚人", "魔术师", "女祭司", "皇帝","女皇", "教皇", "恋人",
    "战车", "力量", "隐士", "命运之轮", "正义", "倒吊人",
    "死神", "节制", "恶魔", "高塔", "星星", "月亮",
    "太阳", "审判", "世界",
     // 权杖
    "权杖Ace", "权杖二", "权杖三", "权杖四", "权杖五", "权杖六",
    "权杖七", "权杖八", "权杖九", "权杖十",
    "权杖侍从", "权杖骑士", "权杖王后", "权杖国王",
    // 宝剑
    "宝剑Ace", "宝剑二", "宝剑三", "宝剑四", "宝剑五", "宝剑六",
    "宝剑七", "宝剑八", "宝剑九", "宝剑十",
    "宝剑侍从", "宝剑骑士", "宝剑王后", "宝剑国王",
    // 圣杯
    "圣杯Ace", "圣杯二", "圣杯三", "圣杯四", "圣杯五", "圣杯六",
    "圣杯七", "圣杯八", "圣杯九", "圣杯十",
    "圣杯侍从", "圣杯骑士", "圣杯王后", "圣杯国王",
    // 星币
    "星币Ace", "星币二", "星币三", "星币四", "星币五", "星币六",
    "星币七", "星币八", "星币九", "星币十",
    "星币侍从", "星币骑士", "星币王后", "星币国王"
    ];

const tarotDeck = tarotNames.map(function(name){
    return { name: name };
});

    let messagesData = [];//消息数据

    const input =document.getElementById("input");
    const sendBtn =document.getElementById("send");
    const messages =document.getElementById("messages");
    const chatArea =document.getElementById("chatArea");
    const wordsInput =document.getElementById("wordsInput");
    //注释
    function renderMessages() {
        messages.innerHTML = "";
        messagesData.forEach(function(msg){
        const div =document.createElement("div");
        if(msg.type === "tarotCard"){
            if(msg.note){
                div.textContent = msg.who+ ":" +msg.note;
                const cardLine = document.createElement("div");
                cardLine.textContent = "   "+msg.cardName + " " + msg.position;
                cardLine.style.color = "#888";
                cardLine.style.fontSize = "0.85em";
                div.appendChild(cardLine);
            }else{
                div.textContent = msg.who+ ":" +msg.cardName + " " + msg.position;
            }
            div.style.cursor = "pointer";
            div.addEventListener("click",function(){
                const note = prompt("注释",msg.note||"");
                if(note === null) return;
                msg.note = note;
                localStorage.setItem("messagesData",JSON.stringify(messagesData));
                renderMessages();
            });
        } else {
            div.textContent = msg.who+ ":" +msg.text;
        }
        messages.appendChild(div);
    });
    chatArea.scrollTop = chatArea.scrollHeight;
}

    const savedGroups = localStorage.getItem("wordGroups");
        if(savedGroups !== null){
            wordGroups = JSON.parse(savedGroups);
        }
        wordsInput.value = Object.entries(wordGroups).map(function(pair){
            return pair[0]+":"+pair[1].join(",");
        }).join("\n");
        input.focus();

    //从localStorage加载消息数据
 const saved = localStorage.getItem("messagesData");
 if(saved !== null){
    messagesData = JSON.parse(saved);
 }
    //把读出来的消息从重新显示到页面上
    messagesData.forEach(function(msg){
        const div =document.createElement("div");
        div.textContent = msg.who+ ":" +msg.text
        messages.appendChild(div);
    });
//发送函数
    sendBtn.addEventListener("click",function() {
        const text =input.value;
        if(text.trim() === "") return;

        //保存消息数据
        messagesData.push({ who:"user",text:text, time:new Date().toLocaleString() });
        localStorage.setItem("messagesData",JSON.stringify(messagesData));
        const div =document.createElement("div");
        div.textContent = "user: "+text;
        messages.appendChild(div);

        //随机回复
        const allWords = Object.values(wordGroups).flat();
        const totalPool = allWords.map(function(w){ return {kind:"word",value:w};})
        .concat(tarotDeck.map(function(c){ return {kind:"tarotCard",value:c};}));
        const picked = totalPool[Math.floor(Math.random()*totalPool.length)];
        setTimeout(function() {
            if(picked.kind === "word"){
                messagesData.push({ who:"peer",text:picked.value, time:new Date().toLocaleString() });
            localStorage.setItem("messagesData",JSON.stringify(messagesData));
            renderMessages();
        }else{
            drawTarotCard(picked.value);
        }
    },500);   
    renderMessages();
    input.value = "";
    input.focus();
    });
        //让peer回复一条消息
function peerSendOne() {
    const allWords = Object.values(wordGroups).flat();
    const reply =allWords[Math.floor(Math.random()*allWords.length)];
    messagesData.push({ who:"peer",text:reply, time:new Date().toLocaleString() });
    localStorage.setItem("messagesData",JSON.stringify(messagesData));
    const peerDiv = document.createElement("div");
    peerDiv.textContent = "peer: "+reply;
    messages.appendChild(peerDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
}
//让peer回复一条消息的按钮点击事件
document.getElementById("peerSend").addEventListener("click",function() {
    peerSendOne();
});
//抽塔罗牌
function drawTarotCard(card) {
    const picked = card||tarotDeck[Math.floor(Math.random()*tarotDeck.length)];
    const position = Math.random()<0.5 ? "正位":"逆位";
    messagesData.push({ 
        who:"peer",
        type:"tarotCard",
        cardName: picked.name,
        position: position,
        note:"",
        time:new Date().toLocaleString()
    });
    localStorage.setItem("messagesData",JSON.stringify(messagesData));
    renderMessages();
}
    


 

        //按Enter键发送消息
input.addEventListener("keydown",function(event){
    if(event.key === "Enter"&& !event.isComposing){
        sendBtn.click();
    }
    });

    //保存字卡函数
    document.getElementById("saveWords").addEventListener("click",function() {
        const newGroups = {};
        wordsInput.value.split("\n").forEach(function(line){
         if (line.trim() === "") return;
            const parts =line.split(":");
            const name = parts[0].trim();
            const words = parts[1].split(",").map(function(w){
            return w.trim();
        }).filter(function(w){
            return w !== "";
        });
            newGroups[name] = words;
    });        
        wordGroups =newGroups;
        //保存字卡
        localStorage.setItem("wordGroups",JSON.stringify(wordGroups));
});
chatArea.scrollTop = chatArea.scrollHeight;


//导出文件函数
    document.getElementById("exportBtn").addEventListener("click",function() {
        const data = {
            wordGroups:wordGroups,
            messagesData:messagesData,
        };
        const json = JSON.stringify(data,null,2);
        const blob = new Blob([json],{type:"application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "chat-data.json";
        //把链接临时加到页面上，再点击然后移除
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        //延迟释放url
        setTimeout(function(){
            URL.revokeObjectURL(url);
        },1000);
    });
//导出字卡函数
    document.getElementById("exportWordsBtn").addEventListener("click",function() {
        const data = {wordGroups:wordGroups,};
        const json = JSON.stringify(data,null,2);
        const blob = new Blob([json],{type:"application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "wordGroups-data.json";
        //把链接临时加到页面上，再点击然后移除
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        //延迟释放url
        setTimeout(function(){
            URL.revokeObjectURL(url);
        },1000);
    });
//导入文件函数
document.getElementById("importBtn").addEventListener("click",function(){
    //step1: get file
    const file =document.getElementById("importFile").files[0];
    if(!file) {
        alert("请选择文件");
        return;
    }
    //step2: read file
    const reader = new FileReader();
    reader.onload =function(event){ //text in file
        const text = event.target.result;
    //step3:parse json and send back
    }
    reader.readAsText(file);//read file as text

    reader.onload =function(event){ //json in file
        const text = event.target.result;
        console.log(text); //print json text
//prase text as json object
        const data = JSON.parse(text);
        wordGroups = data.wordGroups || {};//update words
        messagesData = data.messagesData || [];//update messagesData
        //导入后存进localStorage
        localStorage.setItem("wordGroups",JSON.stringify(wordGroups));
        localStorage.setItem("messagesData",JSON.stringify(messagesData));
        //clear messages div and display again as messagesData
        messages.innerHTML ="";
        messagesData.forEach(function(msg){
            const div = document.createElement("div");
            div.textContent = msg.who+":" + msg.text;
            messages.appendChild(div);
        });
        wordsInput.value =Object.entries(wordGroups).map(function(pair){
            return pair[0] + ":" +pair[1].join(",");
        }).join("\n");
    }
});

    </script>
</body>
</html>
